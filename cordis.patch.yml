# dsh-voice-kit bundle patch: inserts its plugin row into the web plugin roster.
# The bundle is the official dsh plugin shape — install it into a dsh profile
# (`dsh plugin --profile <name> add dsh-voice-kit` or `add link:<path>`). The
# single row mounts BOTH halves: the host side (a v0.1 no-op, future home of
# settings namespaces / TTS proxy endpoints) and the browser side (the modules
# node half scans dsh.client packages into the web plugin roster, served from
# this package's lib/client.js).
- insert:
    - id: voice-kit
      name: 'dsh-voice-kit'
